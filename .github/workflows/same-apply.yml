name: same-apply

on:
  push:
    paths:
      - '.github/workflows/same-apply.yml'
      - '.same-deploy/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verify-search-results
          fetch-depth: 0

      - name: Wait for all parts
        id: gate
        run: |
          if [ ! -f .same-deploy/READY ]; then
            echo "READY marker absent - parts still uploading, skipping."
            echo "go=no" >> $GITHUB_OUTPUT
          else
            echo "go=yes" >> $GITHUB_OUTPUT
          fi

      - name: Assemble, verify and apply patch
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -euo pipefail
          cat .same-deploy/patch.b64.part* > /tmp/all.b64
          echo "base64 bytes: $(wc -c < /tmp/all.b64)"
          base64 -d /tmp/all.b64 > /tmp/all.patch.gz
          echo "9a644775169dd9002baad415337524df793e3c9126e6ed58c342d52eec78a9e2  /tmp/all.patch.gz" | sha256sum -c -
          gunzip -c /tmp/all.patch.gz > /tmp/all.patch
          echo "81bcde64c1c1133150111684b3683c0ad291251f2c304debc9e1e1ace0736f98  /tmp/all.patch" | sha256sum -c -
          echo "patch bytes: $(wc -c < /tmp/all.patch)"
          git apply --verbose --whitespace=nowarn /tmp/all.patch
          echo "APPLIED_OK"

      - name: Remove deploy scaffolding
        if: steps.gate.outputs.go == 'yes'
        run: |
          rm -rf .same-deploy .same-deploy-probe.txt .github/workflows/same-apply.yml

      - name: Commit and push
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -euo pipefail
          git config user.name "same-bot"
          git config user.email "noreply@same.new"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "same: apply staged working-tree changes"
            git push origin HEAD:fix/verify-search-results
            echo "PUSH_OK"
          fi
