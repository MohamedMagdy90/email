name: same-apply

on:
  push:
    paths:
      - '.github/workflows/same-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verify-search-results
          fetch-depth: 0

      - name: Fetch payload and verify integrity
        run: |
          set -euo pipefail
          curl -sSL --retry 5 --retry-all-errors -m 120 \
            "https://h.uguu.se/NBZMFqEs.tgz" -o /tmp/payload.tgz
          echo "bytes: $(wc -c < /tmp/payload.tgz)"
          echo "c6de3d91dc4347575537c9649f6d9a6a147d236bcc5bba9af04343605d149b79  /tmp/payload.tgz" | sha256sum -c -
          echo "INTEGRITY_OK"
          tar -tzf /tmp/payload.tgz

      - name: Extract over working tree
        run: |
          set -euo pipefail
          tar -xzf /tmp/payload.tgz -C .
          echo "--- changed files ---"
          git status --porcelain

      - name: Remove deploy scaffolding
        run: |
          rm -f .same-deploy-probe.txt .github/workflows/same-apply.yml
          rmdir .github/workflows .github 2>/dev/null || true

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "same-bot"
          git config user.email "noreply@same.new"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "same: apply staged working-tree changes"
            git push origin HEAD:fix/verify-search-results
            echo "PUSH_OK"
          fi
