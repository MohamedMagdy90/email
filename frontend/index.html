<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#08090c" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/dna-mark.png" />
    <script>
      /* Theme before first paint - same key as the DNA partner / support / leads
         consoles, so somebody who chose light there gets light here too. */
      (function () {
        try {
          var t = localStorage.getItem("dnaConsoleTheme");
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            var m = document.querySelector("meta[name=theme-color]");
            if (m) m.setAttribute("content", "#ffffff");
          }
        } catch (e) {}
      })();
    </script>
    <title>DNA ERP · Outreach console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
